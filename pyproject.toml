[project]
name = "kinodynamic-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "imageio[ffmpeg]>=2.37.3",
    "mujoco>=3.2",
    "numpy>=1.26",
    "ruckig>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
